name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: write

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4

            - name: Install dependencies
              run: cd app && npm ci

            - name: Build
              run: npm run build

            - name: Create Release + Upload Assets
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      ./dist/adbloka-linux
                      ./dist/adbloka-windows.exe
                      ./dist/adbloka-mac
              env:
                  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
